<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Baitlas" />
    <title>Baitlas</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #0b1020;
        color: #f8fafc;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 7rem);
        letter-spacing: -0.06em;
      }

      p {
        margin: 1rem 0 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, world!</h1>
      <p>Repo moved.</p>
    </main>
  </body>
</html>

name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            materializer/package-lock.json
            renderer/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix materializer
          npm ci --prefix renderer
      - name: Build and validate
        run: |
          npm run build --prefix materializer
          npm test --prefix materializer
          npm run build --prefix renderer
      - name: Package runtime assets
        run: |
          mkdir -p _site/content/projects
          cp index.html 404.html _site/
          cp -R generated _site/
          for project in content/projects/*; do
            if [ -d "$project/assets" ]; then
              mkdir -p "_site/$project"
              cp -R "$project/assets" "_site/$project/"
            fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

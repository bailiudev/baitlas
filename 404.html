<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · Baitlas</title>
  <script>
    // GitHub Pages serves this file for links published before query routing.
    const target=new URL(location.href);
    const oldPage=target.pathname.match(/^(.*\/)(read|hike|about)\/(?:index\.html)?$/);
    if(oldPage){
      target.pathname=oldPage[1];
      target.searchParams.set('page',oldPage[2]);
      location.replace(target.href);
    }
  </script>
</head>
<body>
  <main><h1>Page not found</h1><p>This address has no story yet.</p><a href="./">Return to Baitlas</a></main>
</body>
</html>
